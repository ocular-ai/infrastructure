name: Validate

# Terraform Cloud plans each PR and applies on merge; this job only checks
# formatting and validity, which need no credentials.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      # Skips the cloud backend, which would need a Terraform Cloud token.
      - name: Initialize
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
